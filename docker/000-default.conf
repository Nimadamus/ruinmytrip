<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>
    # Assets carry a ?v= stamp that changes when the file does, so the file at a given URL is
    # immutable and re-validating it on every visit is a round trip spent learning nothing. The
    # service worker and the manifest live at the document root, not here, and stay revalidated --
    # a year-long cache on the thing that decides what else is cached is how a site gets stuck.
    <Directory /var/www/html/public/assets>
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=31536000, immutable"
        </IfModule>
    </Directory>

    # Baseline security headers on every response. HSTS without preload, so it can still be walked
    # back. Permissions-Policy turns off device features no page uses (the site uses only the
    # clipboard and the share sheet, which stay allowed for this origin).
    #
    # The page CSP is sent from PHP (app/csp.php, inventory in docs/CSP_20261030.md): an enforced
    # policy (object-src, base-uri, form-action, frame-ancestors) plus a Report-Only policy for
    # script/style/img/connect, with a per-response nonce Apache cannot know. This frame-ancestors
    # line stays as the backstop for responses PHP never touches (static files, Apache errors).
    # It is "always set" on purpose: that writes Apache's error header table, so it is sent IN
    # ADDITION to the sandbox CSP that media_show() and media_variant() set from PHP (two CSP
    # headers are both enforced). A plain "set" would replace the sandbox policy on media.
    <IfModule mod_headers.c>
        Header set X-Content-Type-Options "nosniff"
        Header set X-Frame-Options "SAMEORIGIN"
        Header set Referrer-Policy "strict-origin-when-cross-origin"
        Header set Strict-Transport-Security "max-age=15552000"
        Header set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
        Header always set Content-Security-Policy "frame-ancestors 'self'"
        # The PHP version is a fingerprint and nothing else.
        Header unset X-Powered-By
    </IfModule>

    # Block direct web access to app internals (defense in depth; they're outside docroot anyway).
    <DirectoryMatch "/var/www/html/(app|views|database|docker|scripts)">
        Require all denied
    </DirectoryMatch>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
