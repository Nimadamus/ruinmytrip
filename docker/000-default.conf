<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>
    # Assets carry a ?v= stamp that changes when the file does, so the file at a given URL is
    # immutable and re-validating it on every visit is a round trip spent learning nothing. The
    # service worker and the manifest live at the document root, not here, and stay revalidated --
    # a year-long cache on the thing that decides what else is cached is how a site gets stuck.
    <Directory /var/www/html/public/assets>
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=31536000, immutable"
        </IfModule>
    </Directory>

    # Block direct web access to app internals (defense in depth; they're outside docroot anyway).
    <DirectoryMatch "/var/www/html/(app|views|database|docker|scripts)">
        Require all denied
    </DirectoryMatch>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
